<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reto 1</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--ink:#000;--mute:#6b6b6b;--card:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--ink:#fff;--mute:#9a9a9a;--card:#000}}
:root[data-theme="dark"]{--bg:#000;--ink:#fff;--mute:#9a9a9a;--card:#000}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Bricolage Grotesque',system-ui,sans-serif;line-height:1.5}
main{max-width:520px;margin:0 auto;padding:26px 16px 60px}
h1{font-size:clamp(2.4rem,9vw,3.4rem);line-height:1;margin:0 0 12px;font-weight:800;letter-spacing:-.03em}
.lead{font-size:1.05rem;max-width:44ch;margin:0 0 4px}
button{font:inherit;cursor:pointer}
button:focus-visible,.win:focus-visible{outline:3px solid #fff;outline-offset:2px;box-shadow:0 0 0 5px #000}
/* habitación */
.room{margin-top:18px;border:3px solid var(--ink);overflow:hidden;color:#000}
.wall{padding:26px 14px 34px;background:repeating-linear-gradient(90deg,#e6e6e8 0 38px,#dddde0 38px 40px)}
.cal{position:relative;margin:0 auto;max-width:360px;background:#fff;border:1px solid #aaa;box-shadow:0 10px 16px rgba(0,0,0,.28);padding:26px 10px 12px;transform:rotate(-1deg)}
.cal::before{content:"";position:absolute;top:-14px;left:50%;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:#444;box-shadow:inset -2px -2px 3px #000}
.rings{position:absolute;top:-6px;left:10px;right:10px;height:14px;background:radial-gradient(circle,#222 0 3.5px,transparent 4.5px) 0 0/22px 14px repeat-x}
.calhead{text-align:center;font-weight:800;letter-spacing:.02em;border-bottom:2px solid #000;padding-bottom:4px;margin-bottom:6px}
.z{position:relative;display:inline-block}
.z::after{content:"";position:absolute;left:50%;top:12%;width:2px;height:76%;margin-left:-1px;background:currentColor;transform:rotate(28deg)}
.dow,.days{display:grid;grid-template-columns:repeat(7,1fr);text-align:center}
.dow{font-size:.62rem;font-weight:800;color:#555;gap:3px;margin-bottom:3px}
.days{gap:3px}
.days button{font:inherit;font-size:.8rem;font-weight:800;color:#000;background:#fff;border:1.5px solid #000;padding:9px 0;cursor:pointer}
.days .e{border:1.5px dashed #ccc;background:transparent;cursor:default}
.days .k{background:#000;color:#fff}
.days .hl{animation:hl 1s 2}
@keyframes hl{50%{background:#000;color:#fff}}
.fmt2{text-align:center;font-size:.75rem;font-weight:800;color:#333;margin-top:12px}
.rc{display:inline-block;border:2.5px solid #d62828;border-radius:50%;padding:5px 16px;transform:rotate(-3deg)}
/* escritorio */
.desk{background:linear-gradient(#2b2b2e,#121214);border-top:8px solid #000;padding:22px 12px 24px;display:flex;flex-direction:column;align-items:center;gap:22px;color:#fff}
.radio{width:100%;max-width:300px;background:#f1f1f1;color:#000;border:3px solid #000;border-radius:16px;padding:12px;box-shadow:0 6px 0 #000}
.screen{min-height:74px;background:#1a1a1a;color:#1a1a1a;border:3px solid #000;border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;justify-content:center;transition:background .3s}
.radio.on .screen{background:#c9d1c0;color:#111}
#s1{font-weight:800;font-size:1.05rem;line-height:1.2}
#s2{font-size:.85rem;margin-top:2px}
.ctrl{display:flex;align-items:center;gap:12px;margin-top:12px}
.grille{flex:1;height:56px;border:2px solid #000;border-radius:10px;background:radial-gradient(circle,#000 1.6px,transparent 2.2px) 0 0/9px 9px}
.playing .grille{animation:pu .5s infinite alternate}
@keyframes pu{to{transform:scale(1.04)}}
.btns{display:flex;gap:8px}
.rb{width:50px;height:50px;border-radius:50%;border:3px solid #000;background:#fff;color:#000;font-weight:800;font-size:.8rem;box-shadow:0 3px 0 #000;padding:0}
.rb:active{transform:translateY(2px);box-shadow:0 1px 0 #000}
.rb[aria-pressed="true"]{background:#000;color:#fff}
.rb:disabled{opacity:.4;cursor:default}
.leds{display:flex;flex-direction:column;gap:6px}
.led{width:13px;height:13px;border:2px solid #000;border-radius:50%;background:#fff;transition:background .1s}
.led.on{background:#000}
.lockwrap{display:flex;flex-direction:column;align-items:center}
.lock{width:262px}
.shk{animation:rt .45s}
@keyframes rt{20%{transform:rotate(-4deg)}40%{transform:rotate(4deg)}60%{transform:rotate(-3deg)}80%{transform:rotate(2deg)}}
.shackle{display:block;margin:0 auto -6px;width:150px;height:92px;overflow:visible;cursor:pointer}
.shackle path{transform-origin:25px 82px;transition:transform .8s cubic-bezier(.3,1.4,.5,1)}
.open .shackle path{transform:translateY(-18px) rotate(-38deg)}
.lbody{position:relative;background:linear-gradient(160deg,#d6d6da,#8b8b91 60%,#a9a9ae);border:3px solid #000;border-radius:18px;padding:16px 12px 14px;box-shadow:0 8px 0 #000}
.lbody::before,.lbody::after{content:"";position:absolute;top:6px;width:7px;height:7px;border-radius:50%;background:#555;box-shadow:inset 1px 1px 1px #000}
.lbody::before{left:8px}.lbody::after{right:8px}
.wheels{display:flex;gap:5px;justify-content:center}
.wheel{display:flex;flex-direction:column;align-items:center}
.wheel button{width:34px;height:18px;border:0;background:transparent;font-size:.7rem;color:#000;padding:0}
.win{width:34px;height:54px;background:#fff;color:#000;border:2px solid #000;border-radius:6px;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:1.8rem;font-weight:800;touch-action:none;cursor:ns-resize;user-select:none;box-shadow:inset 0 9px 8px -7px rgba(0,0,0,.5),inset 0 -9px 8px -7px rgba(0,0,0,.5)}
.win span{display:block}
.win .up{animation:su .15s}.win .dn{animation:sd .15s}
@keyframes su{from{transform:translateY(100%)}}
@keyframes sd{from{transform:translateY(-100%)}}
.plate{color:#000;text-align:center;font-size:.7rem;font-weight:800;margin-top:6px;letter-spacing:.04em}
.pull{margin-top:18px;background:#fff;color:#000;border:3px solid #000;padding:10px 18px;font-weight:800;box-shadow:0 4px 0 #000}
.msg{min-height:1.5em;text-align:center;font-weight:600;margin:10px 0 0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* pistas y premio */
.note{margin-top:20px;border:2px solid var(--ink);padding:16px;background:var(--card)}
.note h2{margin:0 0 8px;font-size:1.05rem;font-weight:800}
.note p{margin:0 0 10px}
.note button{background:var(--bg);color:var(--ink);border:2px solid var(--ink);padding:9px 14px;font-weight:600}
.note button:disabled{opacity:.45;cursor:default}
.hint{border:2px dashed var(--ink);padding:10px 12px;margin-top:10px}
.rst{background:none;border:0;color:var(--mute);text-decoration:underline;font-size:.8rem;padding:6px}
.win-card{display:none;text-align:center}
.win-card.on{display:block}
.big{font-size:1.5rem;font-weight:800;line-height:1.2;margin:8px 0}
</style>
</head>
<body>
<main>
<h1>Reto 1</h1>
<p class="lead">Un calendario que empieza en 0?? Me pregunto si algun numero esconde algo ...</p>

<div class="room">
 <div class="wall">
  <div class="cal" aria-label="Calendario de pared">
   <div class="rings"></div>
   <div class="calhead" aria-label="PIPO P1P0P1P0P1P1P00000">PIPO P1P<span class="z">0</span>P1P<span class="z">0</span>P1P1P<span class="z">0</span><span class="z">0</span><span class="z">0</span><span class="z">0</span><span class="z">0</span></div>
   <div class="dow" id="dow"></div>
   <div class="days" id="days"></div>
   <div class="fmt2"><span class="rc">DD · MM · AA</span></div>
  </div>
 </div>
 <div class="desk">
  <div class="radio" id="radio">
   <div class="screen" id="screen" aria-live="polite"><div id="s1"></div><div id="s2"></div></div>
   <div class="ctrl">
    <div class="grille"></div>
    <div class="btns">
     <button class="rb" id="pwr" aria-pressed="false" aria-label="Encender o apagar la radio">ON</button>
     <button class="rb" id="play" aria-label="Reproducir mensaje" disabled>▶</button>
    </div>
    <div class="leds"><i class="led"></i><i class="led"></i><i class="led"></i></div>
   </div>
  </div>
  <div class="lockwrap">
   <div class="lock" id="lock">
    <svg class="shackle" id="shackle" viewBox="0 0 150 92" aria-hidden="true">
     <path d="M25 92V42a50 50 0 0 1 100 0v50" fill="none" stroke="#000" stroke-width="19" stroke-linecap="butt"/>
     <path d="M25 92V42a50 50 0 0 1 100 0v50" fill="none" stroke="#c7c7cc" stroke-width="12" stroke-linecap="butt" style="pointer-events:none"/>
    </svg>
    <div class="lbody"><div class="wheels" id="wheels"></div><div class="plate">6 DÍGITOS</div></div>
   </div>
   <button class="pull" id="pull">Abrir el candado</button>
   <p class="msg" id="msg" role="status"></p>
  </div>
 </div>
</div>


<div class="note win-card" id="win">
 <h2>Abierto</h2>
 <p>Primera pista del regalo:</p>
 <p class="big">Revelado el 08 de octubre del 2021.</p>
 <p style="color:var(--mute)">Recuerda esta fecha, algo increíble se está cocinando.</p>
</div>
<p style="text-align:center;margin-top:30px"><button class="rst" id="reset">Reiniciar reto</button></p>
</main>

<script>
(function(){
var ANSWER=atob('MDgxMDIx');
var $=function(i){return document.getElementById(i)};
// calendario
['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'].forEach(function(l){var s=document.createElement('span');s.textContent=l;$('dow').appendChild(s)});
for(var k=0;k<35;k++){var b=document.createElement('button'),d=k-3;
if(d>=0&&d<=31){b.dataset.v=d;b.textContent=d;if(d<=1)b.className='k';b.onclick=function(){var n=parseInt(this.dataset.v,10);if(n<=1||n===8)playNumber(n)}}
else{b.className='e';b.disabled=true;b.setAttribute('aria-hidden','true')}
$('days').appendChild(b)}
// candado
var digits=[],wheels=$('wheels'),wins=[],lock=$('lock');
do{digits=[];for(var i=0;i<6;i++)digits.push(Math.floor(Math.random()*10))}while(digits.join('')===ANSWER);
function bump(i,dl){
digits[i]=(digits[i]+dl+10)%10;
var w=wins[i];w.innerHTML='<span class="'+(dl>0?'up':'dn')+'">'+digits[i]+'</span>';
w.setAttribute('aria-valuenow',digits[i]);
}
digits.forEach(function(v,i){
var col=document.createElement('div');col.className='wheel';
var u=document.createElement('button');u.textContent='▲';u.setAttribute('aria-label','Subir dígito '+(i+1));
var w=document.createElement('div');w.className='win';w.tabIndex=0;w.setAttribute('role','spinbutton');w.setAttribute('aria-label','Dígito '+(i+1));w.setAttribute('aria-valuenow',v);
w.innerHTML='<span>'+v+'</span>';
var dn=document.createElement('button');dn.textContent='▼';dn.setAttribute('aria-label','Bajar dígito '+(i+1));
u.onclick=function(){bump(i,1)};dn.onclick=function(){bump(i,-1)};
var y0=null;
w.onpointerdown=function(e){y0=e.clientY;w.setPointerCapture(e.pointerId)};
w.onpointermove=function(e){if(y0===null)return;while(Math.abs(e.clientY-y0)>=16){var up=e.clientY<y0;bump(i,up?1:-1);y0+=up?-16:16}};
w.onpointerup=w.onpointercancel=function(){y0=null};
w.onwheel=function(e){e.preventDefault();bump(i,e.deltaY<0?1:-1)};
w.onkeydown=function(e){if(e.key==='ArrowUp'){e.preventDefault();bump(i,1)}if(e.key==='ArrowDown'){e.preventDefault();bump(i,-1)}};
col.appendChild(u);col.appendChild(w);col.appendChild(dn);wheels.appendChild(col);wins.push(w);
});
function openLock(quiet){
lock.classList.add('open');$('msg').textContent=quiet?'Ya lo habías abierto.':'Clic. Se abrió.';
setTimeout(function(){var w=$('win');w.classList.add('on');w.scrollIntoView({behavior:'smooth',block:'center'})},quiet?0:900);
}
function pull(){
if(lock.classList.contains('open'))return;
if(digits.join('')===ANSWER){try{localStorage.setItem('reto1b','ok')}catch(e){}openLock(false)}
else{$('msg').textContent='No cede. Revisa el orden y los ceros.';lock.classList.remove('shk');void lock.offsetWidth;lock.classList.add('shk')}
}
$('pull').onclick=pull;$('shackle').onclick=pull;
try{if(localStorage.getItem('reto1b')==='ok'){digits=ANSWER.split('').map(Number);wins.forEach(function(w,i){w.innerHTML='<span>'+digits[i]+'</span>'});openLock(true)}}catch(e){}
function resetAll(){
try{localStorage.removeItem('reto1b')}catch(e){}
if(power)$('pwr').click();
stop();
lock.classList.remove('open');$('win').classList.remove('on');$('msg').textContent='';
do{digits=[];for(var i=0;i<6;i++)digits.push(Math.floor(Math.random()*10))}while(digits.join('')===ANSWER);
wins.forEach(function(w,i){w.innerHTML='<span>'+digits[i]+'</span>';w.setAttribute('aria-valuenow',digits[i])});
document.querySelectorAll('.days .m').forEach(function(c){c.classList.remove('m');c.setAttribute('aria-pressed','false')});
window.scrollTo({top:0,behavior:'smooth'});
}
$('reset').onclick=resetAll;

var BLOCKS=['1000','1010','11111100101'],STEP=.75;
var ac=null,bufs=null,run=0,timers=[],srcs=[],playing=false,power=false,leds=document.querySelectorAll('.led');
function getAC(){var A=window.AudioContext||window.webkitAudioContext;if(!ac)ac=new A();if(ac.state==='suspended')ac.resume();return ac}
function load(){
if(bufs)return Promise.resolve(bufs);
var c=getAC();
function dec(u){var b=atob(u.split(',')[1]),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);

}
function ledsOff(){leds.forEach(function(l){l.classList.remove('on')})}
function screen(a,b){$('s1').textContent=a||'';$('s2').textContent=b||''}
function idle(){screen('1 mensaje por escuchar','3 grupos de sonidos')}
function stop(done){
run++;timers.forEach(clearTimeout);timers=[];
srcs.forEach(function(s){try{s.stop()}catch(e){}});srcs=[];
playing=false;$('radio').classList.remove('playing');ledsOff();

if(power){if(done===true)screen('Fin del mensaje','Pulsa ▶ para repetir');else idle()}
}
function schedule(blocks,gap,onStart,onEnd){

var t=ac.currentTime+.1;
blocks.forEach(function(bl,bi){
(function(st,i){timers.push(setTimeout(function(){onStart(i)},Math.max(0,(st-ac.currentTime)*1000)))})(t,bi);
bl.split('').forEach(function(bit){var s=ac.createBufferSource();s.buffer=b[bit];s.connect(ac.destination);s.start(t);srcs.push(s);t+=STEP});

});

}).catch(function(){playing=false;$('radio').classList.remove('playing');$('play').textContent='▶';screen('No se pudo reproducir','Intenta de nuevo')});
